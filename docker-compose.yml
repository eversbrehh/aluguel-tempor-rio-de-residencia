services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lamd-rabbitmq
    hostname: lamd-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lamd}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-lamd123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
    name: lamd_rabbitmq_data
